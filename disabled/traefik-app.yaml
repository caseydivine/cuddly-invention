# ------------------------------------------------------------------------------------
# ArgoCD Application Definition: Traefik Ingress Controller
# This file tells ArgoCD to install Traefik using the official Helm chart.
# ------------------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-ingress
  namespace: argocd # ArgoCD applications are often managed in the argocd namespace
spec:
  project: default
  source:
    repoURL: https://github.com/caseydivine/cuddly-invention
    targetRevision: "HEAD" # Use the latest stable release
    path: app_of_apps/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
