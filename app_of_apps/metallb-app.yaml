# ------------------------------------------------------------------------------------
# ArgoCD Application Definition: MetalLB
# This file tells ArgoCD to install MetalLB using the official Helm chart.
# ------------------------------------------------------------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-controller
  namespace: argocd # ArgoCD applications are often managed in the argocd namespace
spec:
  project: default
  source:
    path: app_of_apps/metallb
    repoURL: https://github.com/caseydivine/cuddly-invention
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

